# 智能星知识助手 · 公共配置
# 默认 dev 环境（keys 直接写在本文件，没有额外的 application-dev.yml）

spring:
  application:
    name: 智能星知识助手
  profiles:
    active: dev

  # 登录态：classpath 上有 spring-session-data-redis，Spring Boot 3 会**自动**把
  # session 存到 Redis（Boot 3 已移除 spring.session.store-type 属性，不用再显式打开）。
  # 好处是重启不掉线、后面多实例部署也不用粘性会话。
  # 注意：往 session 里放的 User 必须可序列化 —— 它已经 implements Serializable。
  session:
    # 30 天过期
    timeout: 2592000
    redis:
      # 默认就是 spring:session，写出来是为了让「session 在 Redis 里」这件事一眼可见
      namespace: star:session

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/star_assistant
    username: root
    password: root

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  # 邮件（邮箱注册验证码）。这段不能省：缺了 JavaMailSender bean 不会创建，启动直接失败。
  # todo 换成自己的 SMTP 账号
  mail:
    host: smtp.qq.com
    port: 587
    username: your_email@qq.com
    password: your_auth_code
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB

server:
  address: 0.0.0.0
  # salary-leap 占着 8101，这里避开
  port: 8102
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 159200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

# 接口文档（knife4j 基于 springdoc），入口 http://localhost:8102/api/doc.html
springdoc:
  info:
    title: 智能星知识助手 API
    description: 智能星知识助手后端接口文档
    version: 1.0
    contact:
      name: XiaoHua
knife4j:
  enable: true

# 向量库（Milvus）。
# 用项目根目录自带的 docker-compose.yml 起（etcd + minio + milvus v2.5.27），容器名带 star- 前缀，
# 数据落在 ./volumes/。注意它和 salary-leap 那套都占 19530，不能同时启动。
#
# ⚠️ 维度是「每个知识库」的记录，不在这里：knowledge_base 表存了每个库建库时的
#    embeddingModel 与 dimension（512）。下面的 dimension 只作为新建知识库的默认值。
#    集合名也按库派生：star_kb_{id}，所以这里只配前缀。
milvus:
  host: localhost
  port: 19530
  collection-prefix: star_kb_
  # 本地 bge-small-zh-v1.5-q 的输出维度，必须与模型一致（见 knowledge/21）
  dimension: 512

# AI 相关开关
ai:
  rerank:
    # 本地重排模型已落地（BAAI/bge-reranker-base 的 ONNX + tokenizer，见 knowledge/21）。
    # 开了它就参与检索链路的精排；关掉则退回 RRF 融合顺序。
    # 两个路径必须存在，否则【启动即失败】——快速失败，别拖到第一次 rerank（M0 坑 1 的教训）。
    # 模型文件体积大（约 1.1GB），不进版本库（models/ 已 gitignore），换机器需重新下载。
    enabled: false
    # 用 int8 量化版（278MB），不是 fp32（1.1GB）：本机 16G 内存常被 IDE + Docker Milvus 占掉大半，
    # fp32 加载直接 ORT "bad allocation"。量化版省内存也更快，精度损失很小。
    model-path: ./models/bge-reranker/model-int8.onnx
    tokenizer-path: ./models/bge-reranker/tokenizer.json

# 知识库原始文件落盘目录（knowledge_document.filePath）
knowledge:
  storage-dir: ./uploads

  # 检索链路参数（见 knowledge/23）。⚠️ 以下数值全部「未标定」：
  # 沿用 salary-leap 的经验值作为起点，本项目语料不同，要定最优值必须先有评测集（knowledge/60）。
  search:
    hybrid-enabled: true    # 关掉退化成纯向量检索
    vector-recall: 20       # 向量这一路召回多少候选
    bm25-recall: 20         # BM25 这一路召回多少候选
    rrf-k: 60               # RRF 平滑常数，原论文默认 60
    max-candidates: 30      # 融合去重后、送进 rerank 前的候选上限
    max-per-source: 2       # 同一文档最多占最终 topK 的几个位置；<=0 不限制
    # ⚠️ 不要照抄 salary-leap 的 0.2。0.2 是远端 text-embedding-v2 的分布；
    # 本地 bge-small-zh 连无关问题都给 0.676（M1 实测），0.2 形同虚设。默认不过滤。
    min-score: 0.0
