# 智能星知识助手 · 公共配置
# 默认 dev 环境（keys 直接写在本文件，没有额外的 application-dev.yml）

spring:
  application:
    name: 智能星知识助手
  profiles:
    active: dev

  # 登录态：classpath 上有 spring-session-data-redis，Spring Boot 3 会**自动**把
  # session 存到 Redis（Boot 3 已移除 spring.session.store-type 属性，不用再显式打开）。
  # 好处是重启不掉线、后面多实例部署也不用粘性会话。
  # 注意：往 session 里放的 User 必须可序列化 —— 它已经 implements Serializable。
  session:
    # 30 天过期
    timeout: 2592000
    redis:
      # 默认就是 spring:session，写出来是为了让「session 在 Redis 里」这件事一眼可见
      namespace: star:session

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/star_assistant
    username: root
    password: root

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  # 邮件（邮箱注册验证码）。这段不能省：缺了 JavaMailSender bean 不会创建，启动直接失败。
  # todo 换成自己的 SMTP 账号
  mail:
    host: smtp.qq.com
    port: 587
    username: your_email@qq.com
    password: your_auth_code
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB

server:
  address: 0.0.0.0
  # salary-leap 占着 8101，这里避开
  port: 8102
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 159200

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）

# 接口文档（knife4j 基于 springdoc），入口 http://localhost:8102/api/doc.html
springdoc:
  info:
    title: 智能星知识助手 API
    description: 智能星知识助手后端接口文档
    version: 1.0
    contact:
      name: XiaoHua
knife4j:
  enable: true

# 向量库（Milvus）。
# 用项目根目录自带的 docker-compose.yml 起（etcd + minio + milvus v2.5.27），容器名带 star- 前缀，
# 数据落在 ./volumes/。注意它和 salary-leap 那套都占 19530，不能同时启动。
#
# ⚠️ 维度是「每个知识库」的记录，不在这里：knowledge_base 表存了每个库建库时的
#    embeddingModel 与 dimension（512）。下面的 dimension 只作为新建知识库的默认值。
#    集合名也按库派生：star_kb_{id}，所以这里只配前缀。
milvus:
  host: localhost
  port: 19530
  collection-prefix: star_kb_
  # 本地 bge-small-zh-v1.5-q 的输出维度，必须与模型一致（见 knowledge/21）
  dimension: 512

# AI 相关开关
ai:
  rerank:
    # 本地重排模型已落地（BAAI/bge-reranker-base 的 ONNX + tokenizer，见 knowledge/21）。
    # 开了它就参与检索链路的精排；关掉则退回 RRF 融合顺序。
    # 两个路径必须存在，否则【启动即失败】——快速失败，别拖到第一次 rerank（M0 坑 1 的教训）。
    # 模型文件体积大（约 1.1GB），不进版本库（models/ 已 gitignore），换机器需重新下载。
    enabled: false
    # 用 int8 量化版（278MB），不是 fp32（1.1GB）：本机 16G 内存常被 IDE + Docker Milvus 占掉大半，
    # fp32 加载直接 ORT "bad allocation"。量化版省内存也更快，精度损失很小。
    model-path: ./models/bge-reranker/model-int8.onnx
    tokenizer-path: ./models/bge-reranker/tokenizer.json

  # 对话模型：DeepSeek-V4.1-Flash（远端，DeepSeek 官方 API，OpenAI 兼容协议），
  # 依赖 langchain4j-open-ai（见 pom.xml）。
  # api-key 走系统环境变量、不写进版本库：  export DEEPSEEK_API_KEY=sk-xxxx
  # 没配 key 时 ChatModelConfig 不装配对话模型 Bean——应用照常启动，只是没有对话能力。
  chat:
    base-url: https://api.deepseek.com
    # 读系统环境变量 DEEPSEEK_API_KEY（DeepSeek 官方平台的 key）
    api-key: ${DEEPSEEK_API_KEY:}
    # 仅用于 ai_call_log.provider（可观测性），不参与调用。换百炼时改成 dashscope
    provider: deepseek
    # DeepSeek 官方 model ID（不是百炼的 deepseek-v4.1-flash——ID 由服务提供方定义）
    model-name: deepseek-flash
    # 采样温度（未标定）：RAG 问答宜低温，0.3 是起点不是结论
    temperature: 0.3
    timeout: 60s
    log-requests: false
    log-responses: false

  # 对话记忆的 token 预算（见 knowledge/11）。当前模型上下文高达 1M，这里【刻意压低到 16K】，
  # 让「记忆裁剪」真实发生、控制 token 成本。下面数字全部「未标定」，是起点不是最优值。
  memory:
    context-window: 16000   # 本应用可用上下文总量（不是模型上限，是成本闸）
    reserve-output: 2048    # 给模型回答预留的 token
    safety-ratio: 0.8       # 预算只用 80%，留余量吸收「按字符估算」的误差
    token-per-char: 1.5     # token ≈ 字符数 × 本值（未标定；中文/英文差异大，单系数只是近似）

  # Agent 主循环（工具调用，见 knowledge/30）。
  agent:
    max-rounds: 8           # 工具调用循环的最大轮次护栏（一轮 = 一次「模型响应 + 可能的一批工具执行」）
    max-tool-result-chars: 4000   # 单个工具结果进 prompt / 事件前的最大字符数，超出截断
    # SSE 心跳（M13）：约每 15 秒推一个 ping 事件，保活并让前端确认连接存活；<=0 关闭
    sse-ping-interval-ms: 15000
    # 超时封存（M13）：SUSPENDED 超过 24h 仍未继续 → CANCELLED，半截文本落成 interrupted 助手消息；<=0 关闭
    suspend-retention-ms: 86400000
    # 封存扫描间隔（10 分钟）与首次扫描延迟（1 分钟）
    seal-scan-interval-ms: 600000
    seal-initial-delay-ms: 60000

  # 可观测性（ai_call_log / ai_tool_log，见 knowledge/50）。
  observability:
    enabled: true
    # ⚠️ 单价「未标定」，默认 0 = 不计算成本（costYuan 写 NULL）。
    # 填了才计算：单位是「元 / 千 token」。不同模型/缓存/思考 token 的计费不同，这里只是粗估。
    input-price-per-1k-yuan: 0
    output-price-per-1k-yuan: 0
    # 请求/响应/工具入参出参落库前的最大字符数（防止 MEDIUMTEXT 被 prompt 撑爆）
    max-snapshot-chars: 8000

# 知识库原始文件落盘目录（knowledge_document.filePath）
knowledge:
  storage-dir: ./uploads

  # 检索链路参数（见 knowledge/23）。⚠️ 以下数值全部「未标定」：
  # 沿用 salary-leap 的经验值作为起点，本项目语料不同，要定最优值必须先有评测集（knowledge/60）。
  search:
    hybrid-enabled: true    # 关掉退化成纯向量检索
    vector-recall: 20       # 向量这一路召回多少候选
    bm25-recall: 20         # BM25 这一路召回多少候选
    rrf-k: 60               # RRF 平滑常数，原论文默认 60
    max-candidates: 30      # 融合去重后、送进 rerank 前的候选上限
    max-per-source: 2       # 同一文档最多占最终 topK 的几个位置；<=0 不限制
    # ⚠️ 不要照抄 salary-leap 的 0.2。0.2 是远端 text-embedding-v2 的分布；
    # 本地 bge-small-zh 连无关问题都给 0.676（M1 实测），0.2 形同虚设。默认不过滤。
    min-score: 0.0

# 离线评测（M1.5，见 knowledge/60）。语料与评估集在 docs/rag-eval/，报告目录已 gitignore。
rag:
  eval:
    # 生产必须关：这会暴露一组耗时很长的评测接口（必须登录，但仍是 dev-only 能力）
    http-enabled: true
    eval-set-file: docs/rag-eval/eval-set.json
    corpus-dir: docs/rag-eval/corpus
    report-dir: docs/rag-eval/reports
    corpus-kb-name: rag-eval-corpus
    # 留空 = 自动创建/复用专用用户 rag-eval；填了就使用该用户（其知识库列表会多一个评测库）
    # user-id:
    default-variants: [all-on, no-hybrid, no-diversity, no-rerank, topk-10]
